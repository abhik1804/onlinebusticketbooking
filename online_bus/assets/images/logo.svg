<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon: Modern Aerodynamic Bus -->
  <g transform="translate(6, 10)">
    <!-- Bus Body Outline -->
    <rect x="0" y="4" width="48" height="34" rx="8" fill="url(#gradBrand)" />
    <!-- Bus Roof Streamline -->
    <path d="M 4 8 Q 16 0 44 4 L 46 16 L 4 16 Z" fill="url(#gradGold)" opacity="0.9" />
    <!-- Windshield -->
    <path d="M 32 8 L 45 10 L 44 22 L 32 22 Z" fill="#e0f2fe" opacity="0.9" />
    <!-- Side Windows -->
    <rect x="6" y="10" width="7" height="10" rx="2" fill="#bae6fd" />
    <rect x="15" y="10" width="7" height="10" rx="2" fill="#bae6fd" />
    <rect x="24" y="10" width="7" height="10" rx="2" fill="#bae6fd" />
    <!-- Headlight beam -->
    <polygon points="46,26 56,22 56,32 46,28" fill="#fef08a" opacity="0.75" />
    <!-- Bus Wheels with Rims -->
    <circle cx="12" cy="38" r="6" fill="#0f172a" />
    <circle cx="12" cy="38" r="3" fill="#cbd5e1" />
    <circle cx="38" cy="38" r="6" fill="#0f172a" />
    <circle cx="38" cy="38" r="3" fill="#cbd5e1" />
    <!-- Speed Lines -->
    <line x1="-5" y1="18" x2="-1" y2="18" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <line x1="-8" y1="24" x2="-2" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: Shreenathji Travels -->
  <g transform="translate(68, 12)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="-0.5">
      SHREENATHJI
    </text>
    <text x="146" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" fill="url(#gradGold)">
      •
    </text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="11" fill="#ea580c" letter-spacing="3.2">
      TRAVELS LUXURY FLEET
    </text>
  </g>
</svg>
